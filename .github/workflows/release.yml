name: Release

# Push a tag like v0.2.0 to publish installers on a GitHub Release:
#   ScreenPilot-<version>-windows.mcpb   double-click to install in Claude Desktop
#   ScreenPilot-<version>-linux.tar.gz   ./install.sh registers it with Claude Code
# Run it by hand (Actions tab) to just build the packages as artifacts.
on:
  push:
    tags: ["v*"]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  package:
    strategy:
      fail-fast: false
      matrix:
        os: [windows-latest, ubuntu-latest]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v7
      - uses: pnpm/action-setup@v6 # version from package.json "packageManager"
      - uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: pnpm
      # Static ffmpeg/ffprobe builds: these get bundled into the package.
      - name: Install ffmpeg
        uses: AnimMouse/setup-ffmpeg@v1
        timeout-minutes: 5
      - run: pnpm install --frozen-lockfile
      - run: pnpm test
      - name: Package (Windows)
        if: runner.os == 'Windows'
        shell: pwsh
        run: pnpm package --ffmpeg-dir (Split-Path (Get-Command ffmpeg).Source)
      - name: Package (Linux)
        if: runner.os == 'Linux'
        run: pnpm package --ffmpeg-dir "$(dirname "$(command -v ffmpeg)")"
      # The packaged server must start and see its bundled tools on its own.
      - name: Check the package
        shell: bash
        run: |
          stage=$(ls -d release/stage-*)
          node "$stage/dist/cli.js" doctor > doctor.json || true
          node -e "const d=require('./doctor.json');console.log(d.summary);const f=d.checks.filter(c=>['ffmpeg','ffprobe','node'].includes(c.name)&&!c.ok);if(f.length){console.error(f);process.exit(1)}"
      - uses: actions/upload-artifact@v7
        with:
          name: package-${{ runner.os }}
          path: |
            release/*.mcpb
            release/*.tar.gz
          if-no-files-found: error

  release:
    if: startsWith(github.ref, 'refs/tags/v')
    needs: package
    runs-on: ubuntu-latest
    steps:
      - uses: actions/download-artifact@v7
        with:
          path: dist
          merge-multiple: true
      - name: Publish GitHub Release
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh release create "${GITHUB_REF_NAME}" dist/* --repo "${GITHUB_REPOSITORY}" --title "ScreenPilot ${GITHUB_REF_NAME}" --generate-notes
