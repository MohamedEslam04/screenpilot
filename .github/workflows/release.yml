name: Release

# Push a tag like v0.2.0 to publish installers on a GitHub Release:
#   ScreenPilot-<version>-windows-setup.exe  the Windows installer (per-user, no admin; adds it to every AI tool)
#   ScreenPilot-<version>-windows.zip    alternative: extract, double-click "ScreenPilot Setup.cmd"
#   ScreenPilot-<version>-windows.mcpb   double-click to install in Claude Desktop only
#   ScreenPilot-<version>-linux.tar.gz   ./install.sh (adds it to every AI tool)
#   ScreenPilot-<version>-macos-arm64.zip / -macos-x64.zip   Install ScreenPilot.command (Apple Silicon / Intel)
#   ScreenPilot-<version>-macos-arm64.mcpb / -macos-x64.mcpb double-click to install in Claude Desktop only
# Run it by hand (Actions tab) to just build the packages as artifacts.
on:
  push:
    tags: ["v*"]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  package:
    strategy:
      fail-fast: false
      matrix:
        # macOS minutes cost 10x on a private repo (free while the repo is public): these jobs only run for releases and by hand.
        os: [windows-latest, ubuntu-latest, macos-latest, macos-15-intel]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v7
      - uses: pnpm/action-setup@v6 # version from package.json "packageManager"
      - uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: pnpm
      # Static ffmpeg/ffprobe builds: these get bundled into the package.
      - name: Install ffmpeg
        uses: AnimMouse/setup-ffmpeg@v1
        timeout-minutes: 5
      - run: pnpm install --frozen-lockfile
      - run: pnpm test
      # Inno Setup 6 builds the .exe installer. It is preinstalled on windows-latest; install it if a runner image drops it.
      - name: Inno Setup
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          $iscc = @("${env:ProgramFiles(x86)}\Inno Setup 6\ISCC.exe", "$env:ProgramFiles\Inno Setup 6\ISCC.exe") | Where-Object { Test-Path $_ } | Select-Object -First 1
          if (-not $iscc) {
            choco install innosetup -y --no-progress
            $iscc = @("${env:ProgramFiles(x86)}\Inno Setup 6\ISCC.exe", "$env:ProgramFiles\Inno Setup 6\ISCC.exe") | Where-Object { Test-Path $_ } | Select-Object -First 1
          }
          if (-not $iscc) { throw 'Inno Setup 6 not found' }
          Write-Host "Using $iscc"
          "ISCC=$iscc" >> $env:GITHUB_ENV
      # The dashboard: a native program (Rust, Slint) that goes in every package as dashboard/. Rust is preinstalled on the runners.
      - name: Dashboard build packages (Linux)
        if: runner.os == 'Linux'
        run: sudo apt-get update && sudo apt-get install -y libfontconfig1-dev libfreetype-dev libxkbcommon-dev libwayland-dev libx11-dev libxcb1-dev
      - name: Build the dashboard
        shell: bash
        working-directory: dashboard
        env:
          # Windows: link the C runtime into the program so it needs no Visual C++ redistributable.
          RUSTFLAGS: ${{ runner.os == 'Windows' && '-C target-feature=+crt-static' || '' }}
        run: cargo build --release -p screenpilot-dashboard
      - name: Package (Windows)
        if: runner.os == 'Windows'
        shell: pwsh
        run: pnpm package --ffmpeg-dir (Split-Path (Get-Command ffmpeg).Source) --dashboard-bin dashboard/target/release/screenpilot-dashboard.exe
      - name: Package (Linux, macOS)
        if: runner.os != 'Windows'
        run: pnpm package --ffmpeg-dir "$(dirname "$(command -v ffmpeg)")" --dashboard-bin dashboard/target/release/screenpilot-dashboard
      # The packaged server must start on its bundled Node and see its bundled tools.
      - name: Check the package
        shell: bash
        run: |
          stage=$(ls -d release/stage-*/ScreenPilot)
          "$stage/bin/node" "$stage/dist/cli.js" doctor > doctor.json || true
          node -e "const d=require('./doctor.json');console.log(d.summary);const f=d.checks.filter(c=>['ffmpeg','ffprobe','node'].includes(c.name)&&!c.ok);if(f.length){console.error(f);process.exit(1)}"
      # The dashboard in the package must start. Windows and macOS runners have a desktop session, so the window really opens
      # (it closes itself after a few seconds); the Linux runner has no display, so there its libraries must at least all resolve.
      - name: Check the dashboard in the package
        shell: bash
        run: |
          stage=$(ls -d release/stage-*/ScreenPilot)
          bin="$stage/dashboard/screenpilot-dashboard"; [ -f "$bin.exe" ] && bin="$bin.exe"
          ls -l "$bin"
          if [ "$RUNNER_OS" = "Linux" ]; then
            ldd "$bin" | tee ldd.txt; ! grep -q "not found" ldd.txt
          else
            cfg="$RUNNER_TEMP/dashcfg"; mkdir -p "$cfg"
            XDG_CONFIG_HOME="$cfg" XDG_CACHE_HOME="$cfg/cache" APPDATA="$cfg" LOCALAPPDATA="$cfg" "$bin" --exit-after 5
            echo "the dashboard window opened and closed (exit $?)"
          fi
      # What "ScreenPilot Setup.cmd" / install.sh do, against a throwaway home folder.
      - name: Check setup
        shell: bash
        run: |
          stage=$(ls -d release/stage-*/ScreenPilot)
          home="$RUNNER_TEMP/fakehome"
          mkdir -p "$home/.codex" "$home/.config/opencode"
          HOME="$home" USERPROFILE="$home" APPDATA="$home/AppData/Roaming" LOCALAPPDATA="$home/AppData/Local" \
            XDG_DATA_HOME="$home/.local/share" XDG_CONFIG_HOME="$home/.config" \
            "$stage/bin/node" "$stage/dist/cli.js" setup --clients codex,opencode > setup.json
          node -e "const r=require('./setup.json');console.log(r.appDir,r.rows);const fs=require('fs'),p=require('path');if(r.rows.some(x=>x.status!=='added')||!r.renderer?.ok||!fs.existsSync(p.join(r.appDir,'dist','mcp.js')))process.exit(1)"
          # setup also puts the dashboard in the application menu / ~/Applications / the Start Menu, with the logo, pointing at the installed copy.
          XDG_DATA_HOME="$home/.local/share" node -e "
            const r=require('./setup.json'),fs=require('fs'),p=require('path'),os=require('os');
            const row=r.rows.find(x=>x.client.startsWith('Dashboard'));
            if(!row||row.status!=='added'){console.error('no dashboard entry',r.rows);process.exit(1)}
            console.log('dashboard entry:',row.detail);
            const need=[row.detail];
            if(process.platform==='darwin')need.push(p.join(row.detail,'Contents','Info.plist'),p.join(row.detail,'Contents','MacOS','ScreenPilot Dashboard'),p.join(row.detail,'Contents','Resources','AppIcon.icns'));
            if(process.platform==='linux')need.push(p.join(process.env.XDG_DATA_HOME,'icons','hicolor','512x512','apps','screenpilot-dashboard.png'));
            const bad=need.filter(f=>!fs.existsSync(f));
            if(bad.length){console.error('missing',bad);process.exit(1)}
            if(process.platform==='linux'){const t=fs.readFileSync(row.detail,'utf8');console.log(t);if(!t.includes(r.appDir)||!/^Icon=/m.test(t)){console.error('entry must point at the installed copy and have an icon');process.exit(1)}}
          "
      # Explorer's zip extractor (and plenty of tools) fail on paths past ~260 characters.
      - name: Check path lengths (Windows)
        if: runner.os == 'Windows'
        shell: bash
        run: node scripts/ci/check-paths.mjs release/stage-windows/ScreenPilot 250
      # Which native modules need the VC++ runtime, and what got bundled next to them (see scripts/vcruntime.ts).
      - name: List DLL dependencies (Windows)
        if: runner.os == 'Windows'
        shell: bash
        run: pnpm exec tsx scripts/vcruntime.ts release/stage-windows/ScreenPilot
      - name: Test the installer .exe (Windows)
        if: runner.os == 'Windows'
        shell: pwsh
        run: ./scripts/ci/test-windows-install.ps1
      - name: Test install.sh (Linux)
        if: runner.os == 'Linux'
        run: bash scripts/ci/test-linux-install.sh
      - uses: actions/upload-artifact@v7
        with:
          name: package-${{ matrix.os }}
          path: |
            release/*.exe
            release/*.zip
            release/*.mcpb
            release/*.tar.gz
            release/app-*.json
          if-no-files-found: error

  release:
    if: startsWith(github.ref, 'refs/tags/v')
    needs: package
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/download-artifact@v7
        with:
          path: dist
          merge-multiple: true
      # Version-free names (ScreenPilot-windows-setup.exe, ...) so the README can link to
      # releases/latest/download/<name> and the links never go stale.
      - name: Name files without the version
        run: |
          v="${GITHUB_REF_NAME#v}"
          for f in dist/*; do n="${f/-${v}-/-}"; [ "$f" = "$n" ] || mv "$f" "$n"; done
          ls -la dist
      # latest.json lets `screenpilot update` replace just the app files (see src/update).
      - name: Write latest.json
        run: |
          node scripts/ci/make-latest.mjs dist
          cat dist/latest.json
      - name: Publish GitHub Release
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh release create "${GITHUB_REF_NAME}" dist/* --repo "${GITHUB_REPOSITORY}" --title "ScreenPilot ${GITHUB_REF_NAME}" --generate-notes
