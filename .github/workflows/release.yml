name: Release

# Push a tag like v0.2.0 to publish installers on a GitHub Release:
#   ScreenPilot-<version>-windows-setup.exe  the Windows installer (per-user, no admin; adds it to every AI tool)
#   ScreenPilot-<version>-windows.zip    alternative: extract, double-click "ScreenPilot Setup.cmd"
#   ScreenPilot-<version>-windows.mcpb   double-click to install in Claude Desktop only
#   ScreenPilot-<version>-linux.tar.gz   ./install.sh (adds it to every AI tool)
# Run it by hand (Actions tab) to just build the packages as artifacts.
on:
  push:
    tags: ["v*"]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  package:
    strategy:
      fail-fast: false
      matrix:
        # macOS minutes cost 10x on private repos: these jobs only run for releases and by hand.
        os: [windows-latest, ubuntu-latest, macos-latest, macos-15-intel]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v7
      - uses: pnpm/action-setup@v6 # version from package.json "packageManager"
      - uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: pnpm
      # Static ffmpeg/ffprobe builds: these get bundled into the package.
      - name: Install ffmpeg
        uses: AnimMouse/setup-ffmpeg@v1
        timeout-minutes: 5
      - run: pnpm install --frozen-lockfile
      - run: pnpm test
      # Inno Setup 6 builds the .exe installer. It is preinstalled on windows-latest; install it if a runner image drops it.
      - name: Inno Setup
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          $iscc = @("${env:ProgramFiles(x86)}\Inno Setup 6\ISCC.exe", "$env:ProgramFiles\Inno Setup 6\ISCC.exe") | Where-Object { Test-Path $_ } | Select-Object -First 1
          if (-not $iscc) {
            choco install innosetup -y --no-progress
            $iscc = @("${env:ProgramFiles(x86)}\Inno Setup 6\ISCC.exe", "$env:ProgramFiles\Inno Setup 6\ISCC.exe") | Where-Object { Test-Path $_ } | Select-Object -First 1
          }
          if (-not $iscc) { throw 'Inno Setup 6 not found' }
          Write-Host "Using $iscc"
          "ISCC=$iscc" >> $env:GITHUB_ENV
      - name: Package (Windows)
        if: runner.os == 'Windows'
        shell: pwsh
        run: pnpm package --ffmpeg-dir (Split-Path (Get-Command ffmpeg).Source)
      - name: Package (Linux, macOS)
        if: runner.os != 'Windows'
        run: pnpm package --ffmpeg-dir "$(dirname "$(command -v ffmpeg)")"
      # The packaged server must start on its bundled Node and see its bundled tools.
      - name: Check the package
        shell: bash
        run: |
          stage=$(ls -d release/stage-*/ScreenPilot)
          "$stage/bin/node" "$stage/dist/cli.js" doctor > doctor.json || true
          node -e "const d=require('./doctor.json');console.log(d.summary);const f=d.checks.filter(c=>['ffmpeg','ffprobe','node'].includes(c.name)&&!c.ok);if(f.length){console.error(f);process.exit(1)}"
      # What "ScreenPilot Setup.cmd" / install.sh do, against a throwaway home folder.
      - name: Check setup
        shell: bash
        run: |
          stage=$(ls -d release/stage-*/ScreenPilot)
          home="$RUNNER_TEMP/fakehome"
          mkdir -p "$home/.codex" "$home/.config/opencode"
          HOME="$home" USERPROFILE="$home" APPDATA="$home/AppData/Roaming" LOCALAPPDATA="$home/AppData/Local" \
            XDG_DATA_HOME="$home/.local/share" XDG_CONFIG_HOME="$home/.config" \
            "$stage/bin/node" "$stage/dist/cli.js" setup --clients codex,opencode > setup.json
          node -e "const r=require('./setup.json');console.log(r.appDir,r.rows);const fs=require('fs'),p=require('path');if(r.rows.some(x=>x.status!=='added')||!r.renderer?.ok||!fs.existsSync(p.join(r.appDir,'dist','mcp.js')))process.exit(1)"
      # Explorer's zip extractor (and plenty of tools) fail on paths past ~260 characters.
      - name: Check path lengths (Windows)
        if: runner.os == 'Windows'
        shell: bash
        run: node scripts/ci/check-paths.mjs release/stage-windows/ScreenPilot 250
      # Which native modules need the VC++ runtime, and what got bundled next to them (see scripts/vcruntime.ts).
      - name: List DLL dependencies (Windows)
        if: runner.os == 'Windows'
        shell: bash
        run: pnpm exec tsx scripts/vcruntime.ts release/stage-windows/ScreenPilot
      - name: Test the installer .exe (Windows)
        if: runner.os == 'Windows'
        shell: pwsh
        run: ./scripts/ci/test-windows-install.ps1
      - name: Test install.sh (Linux)
        if: runner.os == 'Linux'
        run: bash scripts/ci/test-linux-install.sh
      - uses: actions/upload-artifact@v7
        with:
          name: package-${{ matrix.os }}
          path: |
            release/*.exe
            release/*.zip
            release/*.mcpb
            release/*.tar.gz
          if-no-files-found: error

  release:
    if: startsWith(github.ref, 'refs/tags/v')
    needs: package
    runs-on: ubuntu-latest
    steps:
      - uses: actions/download-artifact@v7
        with:
          path: dist
          merge-multiple: true
      # Version-free names (ScreenPilot-windows-setup.exe, ...) so the README can link to
      # releases/latest/download/<name> and the links never go stale.
      - name: Name files without the version
        run: |
          v="${GITHUB_REF_NAME#v}"
          for f in dist/*; do mv "$f" "${f/-${v}-/-}"; done
          ls -la dist
      - name: Publish GitHub Release
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh release create "${GITHUB_REF_NAME}" dist/* --repo "${GITHUB_REPOSITORY}" --title "ScreenPilot ${GITHUB_REF_NAME}" --generate-notes
